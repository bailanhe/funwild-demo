// ============ Onboarding helpers (sports hierarchy + locations) ============
function onbSportToggleCategory(catId) {
  const s = state.onboardingSports[catId] || { picked:false, subs:[] };
  // Toggle: if any sub selected, clear all. If none selected, mark whole category.
  if (s.picked || s.subs.length > 0) {
    state.onboardingSports[catId] = { picked:false, subs:[] };
  } else {
    state.onboardingSports[catId] = { picked:true, subs:[] };
  }
  render();
}
function onbSportToggleSub(catId, subId) {
  const s = state.onboardingSports[catId] || { picked:false, subs:[] };
  const i = s.subs.indexOf(subId);
  if (i >= 0) s.subs.splice(i, 1); else s.subs.push(subId);
  // If any sub is selected, parent's "whole-category" picked is implicitly false
  s.picked = false;
  state.onboardingSports[catId] = s;
  render();
}
function onbSportToggleExpand(catId) {
  state.onboardingSportsExpanded[catId] = !state.onboardingSportsExpanded[catId];
  render();
}
function onbSportTotal() {
  let total = 0;
  for (const k in state.onboardingSports) {
    const s = state.onboardingSports[k];
    if (s.picked) total += 1;
    total += (s.subs || []).length;
  }
  return total;
}
// Flatten the user's sport picks into individual sub-sports (one level marker each)
function onbSelectedSports() {
  const out = [];
  for (const cat of SPORTS_TAXONOMY) {
    const s = state.onboardingSports[cat.id];
    if (!s || (!s.picked && !(s.subs || []).length)) continue;
    const subs = s.picked ? cat.subs : cat.subs.filter(sub => s.subs.indexOf(sub.id) >= 0);
    subs.forEach(sub => out.push({ key: cat.id + ':' + sub.id, cat: cat, sub: sub }));
  }
  return out;
}
function onbCountrySet(code) {
  state.onboardingCountry = code;
  state.onboardingCountryOpen = false;
  state.onboardingCountryQuery = '';
  render();
}
function onbCityToggle(name) {
  const i = state.onboardingCities.indexOf(name);
  if (i >= 0) state.onboardingCities.splice(i, 1);
  else state.onboardingCities.push(name);
  state.onboardingCityQuery = '';
  // Close after pick if a single city selected to free up space for the confirm button
  if (state.onboardingCities.length >= 1 && i < 0) state.onboardingCityOpen = false;
  render();
}
function onbCountryFilter(q) {
  const query = (q || '').trim().toLowerCase();
  if (!query) return LOCATIONS_TAXONOMY;
  return LOCATIONS_TAXONOMY.filter(c => c.name.includes(query) || c.en.toLowerCase().includes(query) || c.code.toLowerCase().includes(query));
}
function onbCityFilter(q) {
  const country = LOCATIONS_TAXONOMY.find(c => c.code === state.onboardingCountry);
  if (!country) return [];
  const query = (q || '').trim().toLowerCase();
  if (!query) return country.cities;
  return country.cities.filter(c => c.name.includes(query) || c.en.toLowerCase().includes(query));
}

// Write onboarding selections back to USER profile
function onbApplyToUser() {
  const country = LOCATIONS_TAXONOMY.find(c => c.code === state.onboardingCountry);
  if (country) USER.country = country.name;
  if (state.onboardingCities.length) USER.city = state.onboardingCities[0];
  // Map sports to legacy USER.sport field (best-effort)
  const snow = state.onboardingSports.snow;
  if (snow) {
    if (snow.picked) USER.sport = '都滑';
    else if (snow.subs.length === 1) USER.sport = ({snowboard:'单板', ski:'双板'})[snow.subs[0]] || USER.sport;
    else if (snow.subs.length > 1) USER.sport = '双修';
  }
  // Save full taxonomy too for future use
  USER.sportTaxonomy = JSON.parse(JSON.stringify(state.onboardingSports));
  USER.locationCountry = state.onboardingCountry;
  USER.locationCities = state.onboardingCities.slice();
}

// Classify warning text into severity tier (heuristic: 关闭/必须/危险=danger; 满/排队/高=warn; else=info)
function classifyWarning(text) {
  if (/关闭|必须|危险|雪崩|风暴|事故/.test(text)) return 'danger';
  if (/满|排队|高|风|消费|拥挤/.test(text))      return 'warn';
  return 'info';
}

// Credit tier badge: visual representation of user trust score.
// 90+ TRUSTED (green) · 70-89 OK (amber) · <70 LOW (red, restricts publish).
function creditChip(score, opts) {
  opts = opts || {};
  const tier = score >= 90 ? 'high' : score >= 70 ? 'mid' : 'low';
  const label = tier === 'high' ? '信用优' : tier === 'mid' ? '信用良' : '信用低';
  const sizeCls = opts.size === 'sm' ? ' sm' : '';
  return `<span class="mp-credit-chip ${tier}${sizeCls}" title="信用分 ${score} · ${label}"><span class="mp-credit-chip-num">${score}</span><span class="mp-credit-chip-label">${label}</span></span>`;
}

function waveSubmit() {
  const c = getCoach(state.miniContext.slug || 'zhanglei');
  const f = state.waveForm;
  // Safety gate: if booking a ski-touring coach OR resort is risky, require safety check
  const r = RESORTS.find(x => x.name === f.resort);
  if ((isSkiTouringCoach(c) || (r && isRiskResort(r))) && !state.safetyConfirmedFor['wave']) {
    safetyCheckOpen({
      context: 'wave',
      summary: c.name + ' 主带进阶 / 野雪场景。出发前请确认安全准备。',
      terrain: isSkiTouringCoach(c) ? 'offpiste' : 'inbounds',
      onConfirm: function() { waveSubmit(); }
    });
    return;
  }
  // Create conversation
  const userMsg = c.name + ' 你好，我想约 ' + f.date + ' · ' + f.duration + '在 ' + f.resort + ' 上课，水平 ' + f.level + '。' + (f.note ? '备注：' + f.note : '');
  const cid = convStart({
    withUid: 'u-coach-' + c.slug, withName: c.name, withInitial: c.initial, withCredit: c.rating ? Math.round(c.rating*20) : 96,
    role: 'sender', kind: 'wave', entityId: c.slug, entityTitle: 'Wave · ' + c.name,
    status: '已发 Wave · 等待教练回复',
    bubbles: [{ role: 'me', text: userMsg, at: '刚刚' }]
  });
  state.outbox.unshift({
    kind: 'wave', convId: cid, toName: c.name, toInitial: c.initial,
    sentAt: '刚刚',
    form: Object.assign({}, f),
    status: '已发送 · 等待教练回复（24h 回复率 ' + c.replyRate + '%）'
  });
  // Schedule multi-turn reply
  scheduleReply(cid, [
    { delay: 2200, text: '你好！我看到你的 Wave。' + f.date + ' 我 ' + (f.duration.indexOf('全天')>-1?'全天':'上午') + '在 ' + f.resort + ' 都行。' + f.level + '水平我们就从蓝道热身，然后上 carving。', statusChange: '教练已接受 · 待确认时间' },
    { delay: 6000, text: '我建议 9:00 在缆车站碰头。第一节 €' + (parseInt((c.rate||'€60').match(/\d+/)||60)) + '。如果 OK 我把微信发你。', statusChange: '待你确认' }
  ]);
  state.showWaveModal = 'sent';
  render();
}

function renderWaveModal() {
  if (state.showWaveModal === 'sent') return renderWaveSent();
  const c = getCoach(state.miniContext.slug || 'zhanglei');
  const f = state.waveForm;
  const resorts = (c && c.resorts && c.resorts.length) ? c.resorts : ['Stubaier Gletscher','Spitzingsee','LAAX','Zermatt','Sölden','Kitzbühel'];
  // ISO date picker bounds: today → today + 6 months
  const today = new Date().toISOString().slice(0,10);
  const maxDate = (function(){ const d=new Date(); d.setDate(d.getDate()+180); return d.toISOString().slice(0,10); })();
  // Migrate legacy date value to ISO if it's the old chip format
  if (f.date && !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) {
    const d = new Date(); d.setDate(d.getDate() + 5);

// Derive deadline days-left deterministically from activity slug (stable across renders).
function activityDaysLeft(a) {
  if (typeof a.daysLeft === 'number') return a.daysLeft;
  let h = 0; const s = a.slug || '';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return (h % 14) + 2; // 2 – 15 days
}

// ===== Outfitter Inquiry Flow =====
function outfitInquiryOpen(slug, intent) {
  state.outfitInquirySlug = slug;
  state.outfitInquiryIntent = intent || '咨询';
  state.outfitInquiryForm = { people: '2', date: '2026-12-26 出团', budget: '€1500-3000', note: '' };
  state.showOutfitInquiry = 'form';
  render();
}
function outfitInquirySet(field, value) { state.outfitInquiryForm[field] = value; render(); }
function outfitInquiryClose() { state.showOutfitInquiry = false; render(); }
function outfitInquirySubmit() {
  const o = getOutfitter(state.outfitInquirySlug);
  const f = state.outfitInquiryForm;
  const intent = state.outfitInquiryIntent;
  const cid = convStart({
    withUid: 'u-outfit-' + o.slug, withName: o.name, withInitial: (o.name||'团').charAt(0), withCredit: Math.round(o.rating*20),
    role: 'sender', kind: 'outfit-inquiry', entityId: o.slug, entityTitle: o.name,
    status: '已发送给团长 · 48h 内回复',
    bubbles: [{ role: 'me', text: intent + ' · ' + o.name + '。' + f.people + ' 人 · ' + f.date + ' · 预算 ' + f.budget + (f.note ? ' · ' + f.note : ''), at: '刚刚' }]
  });
  state.outbox.unshift({
    kind: 'outfit-inquiry', convId: cid,
    outfitName: o.name, outfitInitial: (o.name||'团').charAt(0),
    sentAt: '刚刚',
    form: Object.assign({intent}, f),
    status: '已发送给团长 · 48h 内回复（' + (intent==='占位'?'占位免费 / 24h 内付款保留位置':'人工匹配候选') + '）'
  });
  scheduleReply(cid, [
    { delay: 2800, text: '你好！我看了你的需求。' + f.people + ' 人 · ' + f.date + ' 我们还有名额。', statusChange: '团长回复 · 有名额' },
    { delay: 6500, text: '详细报价：含住宿 4 晚 + 教练 + 缆车 + 翻译 + 接送，' + (o.currency||'€') + o.price + '/人。儿童（< 12 岁）减 30%。明早把详细行程 PDF 发你。', statusChange: '已报价 · 待你确认' },
    { delay: 12000, text: '行程 PDF 已发到你微信。占位免费，24h 内付定金 €200 保留位置。', statusChange: '待付款' }
  ]);
  state.showOutfitInquiry = 'sent';
  render();
}

// ===== Market Contact Flow =====
function marketContactOpen(id) {
  state.marketContactId = id;
  state.marketContactForm = { intent: '想买 · 价格能聊吗', date: '本周内', delivery: '面交', note: '' };
  state.showMarketContact = 'form';
  render();
}
function marketContactSet(field, value) { state.marketContactForm[field] = value; render(); }
function marketContactClose() { state.showMarketContact = false; render(); }
function marketContactSubmit() {
  const m = getMarketItem(state.marketContactId);
  const f = state.marketContactForm;
  const cid = convStart({
    withUid: findUserByName(m.seller.name).uid, withName: m.seller.name, withInitial: m.seller.initial, withCredit: m.seller.credit,
    role: 'sender', kind: 'market-msg', entityId: m.id, entityTitle: m.title,
    status: '已发送给卖家 · 24h 内回复 87%',
    bubbles: [{ role: 'me', text: m.seller.name + ' 你好，看到你出的 ' + m.title + '。' + f.intent + '，' + f.date + '方便。交付：' + f.delivery + (f.note ? '。备注：' + f.note : ''), at: '刚刚' }]
  });
  state.outbox.unshift({
    kind: 'market-msg', convId: cid, itemId: m.id, itemTitle: m.title,
    sellerName: m.seller.name, sellerInitial: m.seller.initial,
    sentAt: '刚刚',
    form: Object.assign({}, f),
    status: '已发送给 ' + m.seller.name + ' · 24h 内回复 87%'
  });
  scheduleReply(cid, [
    { delay: 2400, text: '在的！这个我自用一个雪季，状态确实不错。价格可以聊。', statusChange: '卖家回复 · 可议价' },
    { delay: 5800, text: '€' + Math.max(m.price - 20, m.price - 30) + ' 可以直接拿走。能 ' + (f.delivery==='面交' ? m.seller.city + ' 周末面交' : 'DHL 邮寄到你那') + '。', statusChange: '已报底价 · 待你确认' },
    { delay: 11000, text: '行的话我给你发位置 + 微信。明天下午 14:00 可以？', statusChange: '约见面' }
  ]);
  state.showMarketContact = 'sent';
  render();
}

function marketPostOpen() {
  state.marketPostStep = 1;

  state.marketPostForm = {

function marketPostToggleTag(t) {
  const f = state.marketPostForm;
  const i = f.tags.indexOf(t);
  if (i >= 0) f.tags.splice(i, 1); else f.tags.push(t);
  render();
}
function marketPostClose() { state.showMarketPost = false; render(); }
function marketPostSet(field, value) { state.marketPostForm[field] = value; render(); }
function marketPostStep(delta) {
  state.marketPostStep = Math.max(1, Math.min(4, (state.marketPostStep||1) + delta));
  render();
}
function marketPostSubmit() {
  const f = state.marketPostForm;
  const cid = convStart({
    withUid: 'u-system', withName: '系统 · 我的二手', withInitial: '集', withCredit: null,
    role: 'sender', kind: 'market-listing', entityId: 'lst-' + Date.now(), entityTitle: f.title || ('新二手 · ' + f.cat),
    status: '已发布 · 推送中',
    bubbles: [{ role: 'me', text: '我发布 ' + (f.title||f.cat) + ' · €' + f.price + ' · ' + f.condition + ' · ' + f.city + ' · ' + f.delivery, at: '刚刚' }]
  });
  state.outbox.unshift({
    kind: 'market-listing', convId: cid,
    title: f.title || ('新二手 · ' + f.cat),
    cat: f.cat, condition: f.condition, price: f.price, city: f.city,
    sentAt: '刚刚',
    status: '已发布 · 同城/全国推送 · 等待买家来问'
  });
  scheduleReply(cid, [
    { delay: 3500, text: USERS[1].name + ' 收藏了你的发布。', statusChange: '已收到关注' },
    { delay: 7500, text: USERS[4].name + ' 问：能换个角度看下板底吗？', statusChange: '有买家问' }
  ]);
  state.showMarketPost = 'sent';
  render();
}

// ===== Carpool Join Flow =====
function carpoolJoinOpen(id) {
  state.carpoolJoinId = id;
  const cp = CARPOOLS.find(x => x.id === id);
  const city = (cp && cp.city) || '出发地';
  state.carpoolJoinForm = {
    pickup: city + ' Hauptbahnhof / 火车站',
    gear: '单板 + 雪鞋',
    note: ''
  };
  state.showCarpoolJoinModal = 'form';
  render();
}
function carpoolJoinSet(field, value) { state.carpoolJoinForm[field] = value; render(); }
function carpoolJoinClose() { state.showCarpoolJoinModal = false; state.carpoolJoinId = null; render(); }
function carpoolJoinSubmit() {
  const cp = CARPOOLS.find(x => x.id === state.carpoolJoinId);
  if (!cp) { carpoolJoinClose(); return; }
  const mode = state.carpoolJoinForm._mode || 'form';
  const f = state.carpoolJoinForm;
  let status, firstMsg, replies;
  if (mode === 'offer') {
    status = '已发送 · 等待 ' + cp.organizer.name + ' 确认（你提议载 Ta）';
    firstMsg = '我可以载你去 ' + cp.resort + '。' + f.pickup + ' ' + (f.departTime||'7:00') + ' 出发，' + ((f.seats||3) - 1) + ' 座可拼，' + (f.fee||'AA') + '。';
    replies = [
      { delay: 2200, text: '太好了！谢谢你愿意载。' + (f.pickup||'慕尼黑') + ' 我能赶到。', statusChange: '对方接受 · 路线已转为正常拼车' },
      { delay: 5000, text: '我把油费给你转 €15 当定金。已经发你微信。', statusChange: '准备出发' }
    ];
  } else if (mode === 'pool') {
    status = '已合并求带 · 共同寻找司机中';
    firstMsg = '我也要去 ' + cp.resort + '。我们合并求带，可以一起被载！';
    replies = [
      { delay: 1800, text: '好啊一起！我承担油费 + 高速。', statusChange: '已合并 · 共同等接单' },
      { delay: 6200, text: '我看 N47 群里 ' + (USERS[3].name) + ' 周六也去 ' + cp.resort + '，要不试着 wave 他？', statusChange: '主动找司机中' }
    ];
  } else {
    status = '已申请 · 等待车主同意（12h 内回复）';
    firstMsg = '想加入 ' + cp.date + ' · ' + cp.resort + '。上车点 ' + (f.pickup||'') + '，带 ' + (f.gear||'') + '。' + (f.note ? '备注：' + f.note : '');
    replies = [
      { delay: 2400, text: '可以的，6:30 准时出发，迟到不等。', statusChange: '车主接受 · 待出发' },
      { delay: 5500, text: '把微信发我：funwild-zhangxiaomei。我把你拉到车队群。', statusChange: '已加入 · 群组已创建' }
    ];
  }
  const cid = convStart({
    withUid: 'u-' + (cp.organizer.name||'').toLowerCase(), withName: cp.organizer.name, withInitial: cp.organizer.initial, withCredit: cp.organizer.credit,
    role: 'sender', kind: 'carpool-join', entityId: cp.id, entityTitle: '拼车 · ' + cp.date + ' ' + cp.resort,
    status,
    bubbles: [{ role: 'me', text: firstMsg, at: '刚刚' }]
  });
  state.outbox.unshift({
    kind: 'carpool-join', convId: cid, cpId: cp.id, mode,
    driverName: cp.organizer.name, driverInitial: cp.organizer.initial,
    resort: cp.resort, date: cp.date,
    sentAt: '刚刚',
    form: Object.assign({}, f),
    status
  });
  scheduleReply(cid, replies);
  state.showCarpoolJoinModal = 'sent';
  render();
}
function renderCarpoolJoinModal() {
  if (!state.showCarpoolJoinModal) return '';
  if (state.showCarpoolJoinModal === 'sent') return renderCarpoolJoinSent();
  const cp = CARPOOLS.find(x => x.id === state.carpoolJoinId);
  if (!cp) return '';
  const mode = state.showCarpoolJoinModal; // 'form' | 'offer' | 'pool'
  if (mode === 'offer') return renderCarpoolOfferForm(cp);
  if (mode === 'pool') return renderCarpoolPoolForm(cp);
  return renderCarpoolJoinForm(cp);
}

const CARPOOL_CITY_OPTIONS = [
  { zh: '慕尼黑',     en: 'Munich' },

  { zh: '巴黎',       en: 'Paris' },
  { zh: '法兰克福',   en: 'Frankfurt' },
  { zh: '斯图加特',   en: 'Stuttgart' },
  { zh: '日内瓦',     en: 'Geneva' },
  { zh: '伯尔尼',     en: 'Bern' },
  { zh: '柏林',       en: 'Berlin' },
];
function carpoolDefaultDate() {
  const d = new Date(); d.setDate(d.getDate() + 5);
  return d.toISOString().slice(0,10);
}
function formatCarpoolDate(iso) {
  if (!iso) return '';
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return iso;
  const wk = ['日','一','二','三','四','五','六'];
  const d = new Date(iso + 'T12:00:00');
  return m[2] + '月' + m[3] + '日 · 周' + wk[d.getDay()];
}
function carpoolPublishOpen() {
  state.carpoolPublishStep = 1;
  state.carpoolPublishForm = {
    resort: 'Stubaier Gletscher',
    date: carpoolDefaultDate(),
    depart: '6:30',
    cities: ['慕尼黑'],
    hasCar: '有车', seats: 4,
    levelWanted: '不限', acceptBeginner: '欢迎', vibe: '低调爽滑',
    feeAmount: 30, feeFree: false,
    note: ''
  };
  state.carpoolCityQuery = '';
  state.showCarpoolPublish = true;
  render();
}
function carpoolPublishClose() { state.showCarpoolPublish = false; render(); }
function carpoolPublishSet(field, value) { state.carpoolPublishForm[field] = value; render(); }
function carpoolPublishStep(delta) {
  state.carpoolPublishStep = Math.max(1, Math.min(4, (state.carpoolPublishStep||1) + delta));
  render();
}
function carpoolCityToggle(zh) {
  const f = state.carpoolPublishForm;
  const i = f.cities.indexOf(zh);
  if (i >= 0) {
    if (f.cities.length === 1) return; // keep at least 1
    f.cities.splice(i, 1);
  } else {
    if (f.cities.length >= 3) return; // cap at 3 pickup stops
    f.cities.push(zh);
  }
  state.carpoolCityQuery = '';
  render();
}
function carpoolCityRemove(zh) {
  const f = state.carpoolPublishForm;
  if (f.cities.length === 1) return;
  f.cities = f.cities.filter(c => c !== zh);
  render();
}
function carpoolCityQueryUpdate(v) {
  state.carpoolCityQuery = v;
  render();
}
function carpoolFeeAmountSet(v) {
  const n = Math.max(0, Math.min(200, parseInt(v, 10) || 0));
  state.carpoolPublishForm.feeAmount = n;
  state.carpoolPublishForm.feeFree = (n === 0);
  render();
}
function carpoolFeeMode(mode) {
  const f = state.carpoolPublishForm;
  if (mode === 'free') { f.feeFree = true; f.feeAmount = 0; }
  else { f.feeFree = false; if (!f.feeAmount) f.feeAmount = 30; }
  render();
}
function carpoolFeeLabel(f) {
  return f.feeFree ? '免费 · 朋友捎' : ('€' + (f.feeAmount || 0) + ' / 人 · 来回');
}
function carpoolPublishSubmit() {
  const f = state.carpoolPublishForm;
  // Safety gate: if destination is a high-risk resort, require safety checklist before publishing
  const r = RESORTS.find(x => x.name === f.resort);
  if (r && isRiskResort(r) && !state.safetyConfirmedFor['carpool-publish']) {
    safetyCheckOpen({
      context: 'carpool-publish',
      summary: f.resort + ' 是高海拔 / 冰川雪场。出发前请完成安全确认再发布。',
      terrain: 'inbounds',
      onConfirm: function() { carpoolPublishSubmit(); }
    });
    return;
  }
  const cityStr = f.cities.join(' → ');
  const feeLabel = carpoolFeeLabel(f);
  const dateLabel = formatCarpoolDate(f.date);
  const cid = convStart({
    withUid: 'u-system', withName: '系统 · 我的出行', withInitial: '出', withCredit: null,
    role: 'sender', kind: 'carpool-publish', entityId: 'pub-' + Date.now(), entityTitle: '我发起 · ' + dateLabel + ' ' + f.resort,
    status: '已发布 · 等待申请',
    bubbles: [{ role: 'me', text: '我发起 ' + dateLabel + ' · ' + f.resort + '，从 ' + cityStr + ' ' + f.depart + ' 出发。' + (f.hasCar==='有车' ? f.seats + ' 座可拼 · ' + feeLabel : '求带 · ' + feeLabel), at: '刚刚' }]
  });
  // Serialize legacy display fields for cards/outbox
  const formCopy = Object.assign({}, f, {
    city: cityStr,
    feeNote: feeLabel,
    dateLabel: dateLabel
  });
  state.outbox.unshift({
    kind: 'carpool-publish', convId: cid, sentAt: '刚刚',
    form: formCopy,
    status: '已发布 · 群组聊已开启 · 等待雪友申请'
  });
  scheduleReply(cid, [
    { delay: 4000, text: USERS[1].name + ' 申请加入：上车点 ' + f.cities[0] + ' 火车站，带双板。可承担 €' + (f.feeAmount||30) + '。', statusChange: '1 人申请加入 · 待你审批' },
    { delay: 9000, text: USERS[5].name + ' 申请加入：从 ' + (f.cities[1]||f.cities[0]) + ' 上车，可带 2 人午饭。', statusChange: '2 人申请加入 · 待你审批' }
  ]);
  state.showCarpoolPublish = 'sent';
  render();
}

// ===== Resort Check-In Flow =====
// Stages: 'confirm' → 'success' → ['badge' →] 'share'
function checkInOpen(slug) {
  const r = getResort(slug);
  const prevCount = state.checkedInResorts[slug] || 0;
  const isFirstHere = prevCount === 0;
  const isFirstEver = state.totalCheckIns === 0;
  // Trigger order: 首次任意打卡 → "首次出发" badge; 此雪场首次 → "新雪场探索者" badge variant
  let badge = null;
  if (isFirstEver) badge = { name: '首次出发', copy: '欧洲第一次打卡 · 雪季正式开始', svgIndex: 0 };
  else if (isFirstHere) badge = { name: '新雪场探索者', copy: '又一座阿尔卑斯峰被你解锁', svgIndex: 1 };
  else if ((state.totalCheckIns + 1) % 10 === 0) badge = { name: '打卡 ' + (state.totalCheckIns + 1) + ' 次', copy: '坚持是雪场的语言', svgIndex: 2 };
  state.checkInResortSlug = slug;
  state.checkInData = {
    resort: r,
    date: '2026-01-' + String(15 + state.totalCheckIns).padStart(2,'0'),
    weather: { temp: r.temp, snow: r.snowDepth, condition: '晴 · 中度积雪' },
    badge,
    isFirstHere
  };
  state.showCheckIn = 'confirm';
  render();
}
function checkInClose() {
  state.showCheckIn = false;
  state.checkInData = null;
  state.checkInResortSlug = null;
  state.checkInSharedTo = {};
  render();
}
function checkInConfirm() {
  // Persist
  const slug = state.checkInResortSlug;
  state.checkedInResorts[slug] = (state.checkedInResorts[slug] || 0) + 1;
  state.totalCheckIns += 1;
  // Animate via stages
  state.showCheckIn = 'success';
  render();
  setTimeout(() => {
    if (state.checkInData && state.checkInData.badge) {
      state.showCheckIn = 'badge';
    } else {
      state.showCheckIn = 'share';
    }
    render();
  }, 1100);
}
function checkInToShare() { state.showCheckIn = 'share'; render(); }
function checkInShareTo(ch, label) {
  state.checkInSharedTo = state.checkInSharedTo || {};
  state.checkInSharedTo[ch] = true;
  const d = state.checkInData;
  state.outbox.unshift({
    kind: 'share', title: '已分享到' + label,
    sentAt: '刚刚',
    status: (d ? d.resort.name + ' 打卡海报 · ' : '') + '渠道：' + label
  });
  state.toast = '已分享到 ' + label;
  render();
  setTimeout(() => { state.toast = null; render(); }, 1500);
}
function checkInShare() {
  // Append to outbox as a published moment
  const d = state.checkInData;
  if (d) {
    state.outbox.unshift({
      kind: 'market-listing',
      title: '打卡 · ' + d.resort.name,
      cat: '打卡', condition: d.weather.condition,
      price: state.totalCheckIns, city: d.resort.country,
      sentAt: '刚刚',
      status: '已生成海报 · 朋友圈 / 小红书 / N47 群组可分享'
    });
  }
  checkInClose();
}

function renderCheckInShare() {
  const d = state.checkInData;

  const r = d.resort;

  // Large cinematic badge — 150px
  const badgeSvgLarge = b ? b.svg.replace(/width="120"/, 'width="150"').replace(/height="120"/, 'height="150"') : '';
  const badgeName = d.badge ? d.badge.name : (r ? '雪场打卡' : '本次行程');
  const badgeCopy = d.badge ? d.badge.copy : '又一座阿尔卑斯峰从清单上划掉';
  // Generate QR cells
  const qrCells = (function(){
    let seed = 17 + (r.altitude || 100);
    const cells = [];
    for (let y=0;y<21;y++) for (let x=0;x<21;x++) {
      const inF = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
      const ring = (x===0||x===6||y===0||y===6)&&(x<7&&y<7);
      const ringTR = (x===14||x===20||y===0||y===6)&&(x>13&&y<7);
      const ringBL = (x===0||x===6||y===14||y===20)&&(x<7&&y>13);
      const ctr = (x>=2&&x<=4&&y>=2&&y<=4)||(x>=16&&x<=18&&y>=2&&y<=4)||(x>=2&&x<=4&&y>=16&&y<=18);
      let on;
      if (inF) on = ring||ringTR||ringBL||ctr;
      else { seed = (seed*1103515245+12345)|0; on = ((seed>>>16)&0xff) > 130; }
      if (on) cells.push('<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#0F2419"/>');
    }
    return cells.join('');
  })();

        <path d="M0,200 L0,148 L60,122 L130,138 L200,112 L260,132 L300,116 L300,200 Z" fill="rgba(0,0,0,0.45)"/>
        <path d="M0,200 L0,170 L80,160 L160,168 L240,158 L300,164 L300,200 Z" fill="rgba(0,0,0,0.62)"/>
      </svg>
      <div class="mp-checkin-poster-particles">
        ${Array.from({length: 14}).map((_,i) => `<span style="--x:${(i*73)%100}%;--y:${20 + (i*47)%60}%;--d:${(i*420)%4000}ms"></span>`).join('')}
      </div>

      <div class="mp-checkin-poster-eyebrow">FUNWILD ORIGINAL · 趣野</div>
      <div class="mp-checkin-poster-stamp">CHECK-IN <strong>#${state.totalCheckIns}</strong></div>

      <div class="mp-checkin-poster-badge-hero">
        <div class="mp-checkin-poster-badge-rays"></div>
        <div class="mp-checkin-poster-badge-glow"></div>
        <div class="mp-checkin-poster-badge-art">
          ${badgeSvgLarge || '<div style="width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,var(--acc-300),var(--acc-700));"></div>'}
        </div>
      </div>

      <div class="mp-checkin-poster-title-block">
        <div class="mp-checkin-poster-badge-name">${escHtml(badgeName)}</div>
        <div class="mp-checkin-poster-badge-copy">${escHtml(d.note || badgeCopy)}</div>
      </div>

      <div class="mp-checkin-poster-name">${escHtml(r.name)}</div>

      <div class="mp-checkin-poster-foot">

      </div>

function renderInvitePosterModal() {
  const code = USER.inviteCode || 'funwild-xs2024';
  const initial = (USER.initial || USER.name || 'F').slice(0,1);
  // Deterministic QR pattern seeded from invite code (no Math.random — stable across renders)
  const qrCells = (function(){
    let seed = 0; const s = 'funwild:' + code;
    for (let i=0;i<s.length;i++) seed = (seed*31 + s.charCodeAt(i))|0;
    const cells = [];
    for (let y=0;y<21;y++) for (let x=0;x<21;x++) {
      const inF = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
      const ring = (x===0||x===6||y===0||y===6)&&(x<7&&y<7);
      const ringTR = (x===14||x===20||y===0||y===6)&&(x>13&&y<7);
      const ringBL = (x===0||x===6||y===14||y===20)&&(x<7&&y>13);
      const ctr = (x>=2&&x<=4&&y>=2&&y<=4)||(x>=16&&x<=18&&y>=2&&y<=4)||(x>=2&&x<=4&&y>=16&&y<=18);
      let on;
      if (inF) on = ring||ringTR||ringBL||ctr;
      else { seed = (seed*1103515245+12345)|0; on = ((seed>>>16)&0xff) > 130; }
      if (on) cells.push('<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#0F2419"/>');
    }
    return cells.join('');
  })();
  const shared = state.invitePosterSharedTo || {};
  return `
<div class="mp-modal-bg" onclick="if(event.target===this) invitePosterClose();">
  <div class="mp-modal mp-checkin-share-modal" onclick="event.stopPropagation();">
    <div class="mp-form-header">

    <div class="mp-checkin-poster">
      <div class="mp-checkin-poster-hero"></div>
      <svg class="mp-checkin-poster-mountains" viewBox="0 0 300 200" preserveAspectRatio="xMidYMax slice">
        <path d="M0,200 L0,108 L48,76 L100,90 L160,42 L210,80 L260,52 L300,68 L300,200 Z" fill="rgba(255,255,255,0.18)"/>
        <path d="M0,200 L0,148 L60,122 L130,138 L200,112 L260,132 L300,116 L300,200 Z" fill="rgba(0,0,0,0.45)"/>
        <path d="M0,200 L0,170 L80,160 L160,168 L240,158 L300,164 L300,200 Z" fill="rgba(0,0,0,0.62)"/>
      </svg>
      <div class="mp-checkin-poster-particles">
        ${Array.from({length: 14}).map((_,i) => `<span style="--x:${(i*73)%100}%;--y:${20 + (i*47)%60}%;--d:${(i*420)%4000}ms"></span>`).join('')}
      </div>

      <div class="mp-checkin-poster-eyebrow">FUNWILD · 邀请你加入</div>

      <div class="mp-checkin-poster-badge-hero">
        <div class="mp-checkin-poster-badge-rays"></div>
        <div class="mp-checkin-poster-badge-glow"></div>
        <div class="mp-checkin-poster-badge-art">
          <div style="width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,var(--acc-300),var(--acc-700));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:52px;font-weight:600;color:white;box-shadow:0 8px 28px rgba(0,0,0,0.28);">${escHtml(initial)}</div>
        </div>
      </div>

      <div class="mp-checkin-poster-title-block">
        <div class="mp-checkin-poster-badge-name">${escHtml(USER.name)}</div>
        <div class="mp-checkin-poster-badge-copy">${escHtml(USER.city)} · ${escHtml(USER.sport)} · ${escHtml(USER.level)}</div>
      </div>

      <div class="mp-checkin-poster-name" style="font-size:16px;">徽章 ${USER.badges}/${USER.totalBadges} · 信用 ${USER.credit}</div>
      <div class="mp-checkin-poster-meta">邀请码 ${escHtml(code)} · 邀请 1 人 +5 信用 / 双方</div>

      <div class="mp-checkin-poster-foot">
        <div>
          <div class="mp-checkin-poster-foot-l">FUNWILD</div>
          <div class="mp-checkin-poster-foot-body">扫码 · 加入欧洲华人雪友</div>
        </div>
        <div class="mp-checkin-poster-qr">

            ${qrCells}

  </div>
</div>`;
}

function profileEditSaveFull() {

  Object.assign(USER, state.profileEditForm || {});
  if (state.webUser) {
    state.webUser.name = USER.name || state.webUser.name;

}

// ===== Outbox item (user-submitted records: waves, carpool joins, market inquiries, outfitter inquiries) =====
function outboxBadge(o) {
  const c = o.convId && state.conversations[o.convId];
  if (!c || !c.unread) return '';
  return '<span class="mp-outbox-badge">' + c.unread + ' 新回复</span>';
}
function outboxClick(o) {
  return o.convId ? ('onclick="openConv(' + JSON.stringify(o.convId) + ')"') : '';

// ============ Search Modal (overlay inside phone frame) ============
function renderMpSearch() {
  const q = (state.searchQuery || '').trim().toLowerCase();
  const tab = state.searchTab || 'resort';
  const matches = (item, text) => !q || text.toLowerCase().indexOf(q) !== -1;
  const results = (() => {
    if (tab === 'resort')   return RESORTS.filter(r => matches(r, r.name + ' ' + r.country + ' ' + (r.tags||[]).join(' ')));
    if (tab === 'coach')    return COACHES.filter(c => matches(c, c.name + ' ' + c.sport + ' ' + c.city));
    if (tab === 'activity') return ACTIVITIES.filter(a => matches(a, a.name + ' ' + a.resort + ' ' + a.type));
    if (tab === 'carpool')  return CARPOOLS.filter(cp => matches(cp, cp.resort + ' ' + cp.city + ' ' + cp.note));
    if (tab === 'market')   return MARKET.filter(m => matches(m, m.title + ' ' + m.cat + ' ' + (m.tags||[]).join(' ')));
    return [];
  })();

  const renderItem = (it) => {
    if (tab === 'resort')   return `<div class="mp-search-item" onclick="closeSearch();goMini('resort-detail',{slug:'${it.slug}'})"><strong>${escHtml(it.name)}</strong><span>${escHtml(it.country)} · ${it.altitude}m · ${it.runs}km</span></div>`;
    if (tab === 'coach')    return `<div class="mp-search-item" onclick="closeSearch();goMini('coach-detail',{slug:'${it.slug}'})"><strong>${escHtml(it.name)}</strong><span>${escHtml(it.sport)} · ${escHtml(it.city)} · ${escHtml(it.rate)}</span></div>`;
    if (tab === 'activity') return `<div class="mp-search-item" onclick="closeSearch();goMini('activity-detail',{slug:'${it.slug}'})"><strong>${escHtml(it.name)}</strong><span>${escHtml(it.date)} · ${escHtml(it.resort)} · ${it.price?'€'+it.price:'免费'}</span></div>`;
    if (tab === 'carpool')  return `<div class="mp-search-item" onclick="closeSearch();goMini('carpool-detail',{id:'${it.id}'})"><strong>${escHtml(it.date)} · ${escHtml(it.resort)}</strong><span>${escHtml(it.organizer.name)} · ${it.hasCar?'有车 '+it.total+' 座':'求带'}</span></div>`;
    if (tab === 'market')   return `<div class="mp-search-item" onclick="closeSearch();goMini('market-detail',{id:'${it.id}'})"><strong>${escHtml(it.title)}</strong><span>${escHtml(it.cat)} · €${it.price} · ${escHtml(it.condition)}</span></div>`;
    return '';
  };

  return `
<div class="mp-search-overlay">
  <div class="mp-search-head">
    <div class="mp-search-box">
      ${icon('search', 14, 'var(--text-muted)')}
      <input class="mp-search-input" value="${escHtml(q)}" placeholder="搜雪场 / 教练 / 活动 / 拼车 / 装备" autofocus oninput="state.searchQuery=this.value;render()">
      ${q ? '<button class="mp-search-clear" onclick="setSearchQuery(\'\')">×</button>' : ''}
    </div>
    <button class="mp-search-cancel" onclick="closeSearch()">取消</button>
  </div>
  <div class="mp-search-tabs">
    ${[['resort','雪场'],['coach','教练'],['activity','活动'],['carpool','拼车'],['market','装备']].map(([id,label]) => `
      <button class="mp-search-tab ${id===tab?'active':''}" onclick="setSearchTab('${id}')">${label}</button>
    `).join('')}
  </div>

  ${!q ? `
    <div class="mp-search-body">
      <div class="mp-search-eyebrow">最近搜索</div>
      <div class="mp-search-chip-row">
        ${state.searchHistory.map(h => `<button class="mp-form-chip" onclick="setSearchQuery('${escHtml(h)}')">${escHtml(h)}</button>`).join('')}
      </div>
      <div class="mp-search-eyebrow" style="margin-top:14px;">热门</div>
      <div class="mp-search-chip-row">
        ${['Stubaier','Spitzingsee','Zermatt','张磊','Camp Good Times','Burton Custom','慕尼黑出发','本周末'].map(h => `<button class="mp-form-chip" onclick="setSearchQuery('${escHtml(h)}')">${escHtml(h)}</button>`).join('')}
      </div>
    </div>
  ` : `
    <div class="mp-search-body">
      <div class="mp-search-eyebrow">结果 · ${results.length}</div>
      ${results.length === 0 ? '<div class="mp-search-empty">没找到匹配。换关键词或切换分类试试。</div>' : results.map(renderItem).join('')}
    </div>
  `}
</div>`;
}

  state.showCheckIn = false;

function demoSelectFlow(i) {
  if (i < 0 || i >= DEMOS.length) return;
  state.demoFlowIdx = i;
  state.demoStepIdx = -1;
  demoSoftReset();
  render();
}
function demoNextStep() {
  const flow = DEMOS[state.demoFlowIdx];
  if (!flow) return;
  const next = state.demoStepIdx + 1;
  if (next >= flow.steps.length) return;
  state.demoStepIdx = next;
  const step = flow.steps[next];
  if (step && step.go) step.go();
  render();
}
function demoPrevStep() {
  const flow = DEMOS[state.demoFlowIdx];
  if (!flow) return;
  if (state.demoStepIdx <= 0) { state.demoStepIdx = -1; demoSoftReset(); render(); return; }
  const target = state.demoStepIdx - 1;
  // Replay 0..target from a clean slate so state is deterministic.
  demoSoftReset();
  for (let k = 0; k <= target; k++) {
    if (flow.steps[k].go) flow.steps[k].go();
  }
  state.demoStepIdx = target;
  render();
}
function demoGoToStep(i) {
  const flow = DEMOS[state.demoFlowIdx];
  if (!flow || i < 0 || i >= flow.steps.length) return;
  demoSoftReset();
  for (let k = 0; k <= i; k++) {
    if (flow.steps[k].go) flow.steps[k].go();
  }
  state.demoStepIdx = i;
  render();
}
function demoReset() {
  demoSoftReset();
  state.miniPage = 'home';
  state.homeLoaded = false;
  state.homeHeroMode = 'default';
  state.resortWarnExpanded = false;
  state.demoStepIdx = -1;
  render();
}

function renderDemoPlayer() {
  const flow = DEMOS[state.demoFlowIdx || 0] || DEMOS[0];
  const cur = (typeof state.demoStepIdx === 'number') ? state.demoStepIdx : -1;
  const total = flow.steps.length;
  const atStart = cur <= -1;
  const atEnd   = cur >= total - 1;
  return `
<div class="demo-player">
  <div class="demo-header">
    <div class="demo-eyebrow">DEMO PLAYER</div>
    <div class="demo-title">${escHtml(flow.title)}</div>
    <div class="demo-progress">
      <span>${atStart ? '未开始' : '步骤 ' + (cur+1) + ' / ' + total}</span>
      <div class="demo-progress-bar"><div class="demo-progress-fill" style="width:${atStart?0:((cur+1)/total*100)}%;"></div></div>
    </div>
  </div>

  <div class="demo-flow-picker">
    ${DEMOS.map((d,i) => `
      <button class="demo-flow-pill ${i===state.demoFlowIdx?'active':''}" onclick="demoSelectFlow(${i})" title="${escHtml(d.title)}">${escHtml(d.short)}</button>
    `).join('')}
  </div>

  <div class="demo-steps">
    ${flow.steps.map((s,i) => `
      <div class="demo-step ${i===cur?'current':''} ${i<cur?'done':''}" onclick="demoGoToStep(${i})">
        <span class="demo-step-num">${i<cur?'✓':String(i+1).padStart(2,'0')}</span>
        <div class="demo-step-body">
          <div class="demo-step-label">${escHtml(s.label)}</div>
          ${i===cur && s.hint ? `<div class="demo-step-hint">${escHtml(s.hint)}</div>` : ''}
        </div>
      </div>
    `).join('')}
  </div>

  <div class="demo-controls">
    <button class="demo-btn ghost" onclick="demoPrevStep()" ${atStart?'disabled':''}>← 上一步</button>
    <button class="demo-btn primary" onclick="demoNextStep()" ${atEnd?'disabled':''}>${atStart ? '开始演示 →' : atEnd ? '已完成 ✓' : '下一步 →'}</button>
  </div>
  <button class="demo-btn link" onclick="demoReset()">↺ 重置流程</button>

  <div class="demo-state-footer">
    <span>页面 · <strong>${state.miniPage}</strong></span>
    <span>主题 · <strong>${state.theme}</strong></span>
  </div>
</div>`;
}

function webListHeader(eyebrow, title, sub, count) {
  return `
<div class="web-list-hero">

</div>`;

function webListSidebar(groups, kind) {
  // kind is the filter key (resort/coach/activity/outfitter/market). When set,
  // clicks update state.webFilter[kind][group.key] = item.label and re-render.
  if (!state.webFilter) state.webFilter = {};
  const filterState = (kind && state.webFilter[kind]) || {};
  return `
<aside class="web-list-rail">
  ${groups.map(g => {
    const groupKey = g.key || g.title;
    const activeLabel = filterState[groupKey] || g.items[0].label;
    return `
    <div class="web-list-rail-block">
      <div class="web-list-rail-h">${escHtml(g.title)}</div>
      ${g.items.map((it) => {
        const isActive = it.label === activeLabel;
        const onClick = kind ? `webListFilterSet('${kind}','${escHtml(groupKey)}','${escHtml(it.label)}')` : '';
        return `
        <div class="web-list-rail-item ${isActive?'active':''}" ${onClick?`onclick="${onClick}"`:''}>
          <span>${escHtml(it.label)}</span>
          ${it.count!==undefined ? `<em>${it.count}</em>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}
  <div class="web-list-rail-cta">
    <div class="web-list-rail-cta-h">在小程序内打开</div>
    <button class="web-cta-ghost" style="width:100%;font-size:12px;padding:8px;" onclick="openQrModal({target:'home', ctx:{}, fromPage: state.webPage, title:'扫码进小程序', subtitle:'18 雪场 · 142 徽章 · 拼车关系链', hint:'点击二维码模拟扫码进入小程序首页'})">扫码 →</button>
  </div>
</aside>`;
}

function webListFilterSet(kind, groupKey, label) {
  if (!state.webFilter) state.webFilter = {};
  if (!state.webFilter[kind]) state.webFilter[kind] = {};
  // Toggle: clicking the same filter resets to "全部"
  if (state.webFilter[kind][groupKey] === label) {
    delete state.webFilter[kind][groupKey];
  } else {
    state.webFilter[kind][groupKey] = label;
  }
  render();
}
function webListFilterMatch(kind, item) {
  if (!state.webFilter || !state.webFilter[kind]) return true;
  const f = state.webFilter[kind];
  for (const key in f) {
    const val = f[key];
    if (val === '全部') continue;
    if (key === 'country' && item.country && val.indexOf(item.country) < 0) return false;
    if (key === 'tag' && Array.isArray(item.tags) && item.tags.indexOf(val) < 0) return false;
    if (key === 'drive' && item.drive) {
      // ~1h → < 2h, ~2-3h → 2-4h, ~4h+ → 4h+
      const hours = parseFloat((item.drive.match(/[\d.]+/) || ['0'])[0]);
      if (val === '< 2h' && hours >= 2) return false;
      if (val === '2-4h' && (hours < 2 || hours > 4)) return false;
      if (val === '4h+' && hours < 4) return false;
    }
    if (key === 'sport' && item.sport && item.sport !== val) return false;
    if (key === 'lang' && item.langs && item.langs.indexOf(val) < 0) return false;
    if (key === 'city' && item.city && item.city !== val) return false;
    if (key === 'cat' && item.cat && item.cat !== val) return false;
    if (key === 'type' && item.type && item.type !== val) return false;
  }
  return true;
}

    <div class="web-list-grid">

// ===== Web Activity List =====
function renderWebActivityList() {
  const byOrg = {};
  ACTIVITIES.forEach(a => byOrg[a.organizer] = (byOrg[a.organizer]||0) + 1);
  const groups = [
    { title: '主办方', key: 'organizer', items: [
      { label: '全部', count: ACTIVITIES.length },
      ...Object.keys(byOrg).map(o => ({ label: o, count: byOrg[o] }))
    ]},
    { title: '类型', key: 'type', items: [
      { label: '全部' },
      ...[...new Set(ACTIVITIES.map(a => a.type))].map(t => ({ label: t }))
    ]},
    { title: '价格', key: 'priceBand', items: [
      { label: '全部' }, { label: '免费' }, { label: '< €100' }, { label: '€100-500' }, { label: '€500+' }
    ]}
  ];
  const matchAct = (a) => {
    if (!state.webFilter || !state.webFilter.activity) return true;
    const f = state.webFilter.activity;
    if (f.organizer && f.organizer !== '全部' && a.organizer !== f.organizer) return false;
    if (f.type && f.type !== '全部' && a.type !== f.type) return false;
    if (f.priceBand && f.priceBand !== '全部') {
      const p = a.price || 0;
      if (f.priceBand === '免费' && p > 0) return false;
      if (f.priceBand === '< €100' && (p === 0 || p >= 100)) return false;
      if (f.priceBand === '€100-500' && (p < 100 || p > 500)) return false;
      if (f.priceBand === '€500+' && p <= 500) return false;
    }
    return true;
  };
  const filtered = ACTIVITIES.filter(matchAct);
  return `
<div class="web-breadcrumb"><a onclick="goWeb('home')">Funwild</a> / 活动</div>
<div class="web-list-layout">
  ${webListSidebar(groups, 'activity')}
  <div class="web-list-main">
    ${webListHeader('ACTIVITIES · ' + filtered.length, '本月 30+ 户外活动', 'N47 训练营 · 品牌方试板 · 个人组团 · 社交活动', filtered.length)}
    ${filtered.length === 0 ? `<div style="padding:60px 20px;text-align:center;background:var(--surface-raised);border:1px dashed var(--bd-default);border-radius:10px;"><div style="font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:6px;">没找到活动</div><button class="web-cta-ghost" style="margin-top:14px;" onclick="state.webFilter={};render()">清空筛选</button></div>` : ''}
    <div class="web-list-grid">
      ${filtered.map(a => webActivityCard(a)).join('')}
    </div>
  </div>
</div>`;
}

function webActivitySignupOpen(slug) {
  state.webModalContext = { slug };

function webActivitySignupSubmit() {
  const slug = state.webModalContext && state.webModalContext.slug;
  const a = getActivity(slug);
  if (!a) return webActivitySignupClose();
  const f = state.webActivityForm;
  const peopleCount = parseInt((f.people||'1').replace('+',''), 10) || 1;
  // 直接报名 + 有价格 → 走 wx pay 流程
  if (f.mode === '直接报名' && a.price && a.price > 0) {
    state.showWebActivitySignup = false;
    wxPayOpen({
      amount: a.price * peopleCount,
      title: a.name,
      body: f.people + ' 人 · ' + a.date + ' · ' + a.resort,
      onSuccess: function() {
        state.outbox.unshift({
          kind: 'wave', toName: a.name, toInitial: '活', sentAt: '刚刚',
          form: { resort: a.resort, date: a.date, duration: '已付款', level: f.people + ' 人 · €' + (a.price * peopleCount) + ' 已付' },
          status: '已付款 · 已加入活动群'
        });
        state.notifications.unshift({
          id: 'n-' + Date.now(), kind: 'system',
          title: '报名成功 · ' + a.name,
          body: '€' + (a.price * peopleCount) + ' 已扣款 · 团长已收到通知',
          at: '刚刚', unread: true
        });
        wxPayClose();
        goWeb('messages');
      }
    });
    return;
  }
  // 免费占位 / 免费活动 → 直接入 outbox
  state.outbox.unshift({
    kind: 'wave', toName: a.name, toInitial: '活', sentAt: '刚刚',
    form: { resort: a.resort, date: a.date, duration: f.mode, level: f.people + ' 人 ' + f.mode + (f.note ? ' · ' + f.note : '') },

  state.showWebActivitySignup = false;
  goWeb('messages');
}

function coachScheduleToggle(key) {
  if (!state.coachSchedule) state.coachSchedule = {};
  const cur = state.coachSchedule[key];
  // Empty → open → tentative → booked → empty
  if (!cur) state.coachSchedule[key] = { status:'open' };
  else if (cur.status === 'open') state.coachSchedule[key] = { status:'tentative' };
  else if (cur.status === 'tentative') state.coachSchedule[key] = { status:'booked', student:'待录入' };
  else delete state.coachSchedule[key];
  render();
}

// ===== Safety Checklist Modal (reusable across flows) =====
// Triggered before high-risk submissions: ski touring carpool / off-piste wave / glacier activity
state.safetyCheckChecks = state.safetyCheckChecks || {};
state.safetyConfirmedFor = state.safetyConfirmedFor || {};

function safetyCheckOpen(opts) {
  // opts: { context, onConfirm, summary, terrain: 'inbounds'|'offpiste' }
  // terrain = 系统对地形的初判：'offpiste' 显示野雪专属项，'inbounds' 只显示通用项。用户可一键切换。
  state.showSafetyCheck = Object.assign({ context:'', onConfirm:null, summary:'', terrain:'offpiste' }, opts || {});
  state.safetyCheckChecks = {};
  render();
}
function safetyCheckClose() { state.showSafetyCheck = null; render(); }
function safetyCheckToggle(idx) {
  state.safetyCheckChecks[idx] = !state.safetyCheckChecks[idx];
  render();
}
function safetyCheckSetTerrain(t) {
  if (!state.showSafetyCheck || state.showSafetyCheck.terrain === t) return;
  state.showSafetyCheck.terrain = t;
  state.safetyCheckChecks = {}; // 条目集合变了，已勾选作废重来
  render();
}
function safetyCheckConfirm() {
  const s = state.showSafetyCheck;
  if (!s) return;
  // Mark this context as safety-confirmed so we don't re-prompt within the same flow
  state.safetyConfirmedFor[s.context] = true;
  const cb = s.onConfirm;
  // Award safety badge progress (mock: unlock "装备齐全" on 10th confirmation)
  state.safetyConfirmCount = (state.safetyConfirmCount || 0) + 1;
  if (state.safetyConfirmCount === 1) {
    state.notifications.unshift({
      id: 'n-' + Date.now(), kind: 'badge',
      title: '安全意识 +1',
      body: '你完成了第一次安全确认 · 距离「装备齐全」徽章 9/10',
      at: '刚刚', unread: true
    });
  }
  state.showSafetyCheck = null;
  render();
  if (typeof cb === 'function') cb();
}
function renderSafetyCheckModal() {
  if (!state.showSafetyCheck) return '';
  const s = state.showSafetyCheck;
  const isOff = (s.terrain || 'offpiste') === 'offpiste';

  // 通用项：道内 / 道外都要确认
  const UNIVERSAL = [
    { t: '我量力而行 · 不超出自己能力的雪道和地形', d: '高估自己是受伤事故里最常见的一条。累了、天黑、能见度差就下撤。' },
    { t: '我有同伴或已告知他人行程 + 紧急联系方式', d: '至少让一个人知道你今天在哪、几点回。山地救援电话 112。' }
  ];
  // 野雪 / 道外专属项：只在 offpiste 场景出现（道内雪友通常不会遇到雪崩风险）
  const OFFPISTE = [
    { t: '我带了 LVS · 探针 · 雪铲，并做了出发前互检', d: '雪崩信标 / 探针 / 雪铲三件套。出发前互检信号收发，每次。' },
    { t: '我查了今天的雪崩公告 + 天气', d: '3 级以上警报禁止野外 · 2 级避开 30°+ 坡。avalanche.report(奥) / slf.ch(瑞)。' },
    { t: '我不单独行动，有回撤窗口和路线计划', d: '永远不要 solo ski tour。什么时间没到顶就掉头，回撤不丢人。' }
  ];

  const groups = isOff
    ? [ { label:'通用', danger:false, items:UNIVERSAL }, { label:'野雪 / 道外专属', danger:true, items:OFFPISTE } ]
    : [ { label:'', danger:false, items:UNIVERSAL } ];
  const total = groups.reduce((n,g)=>n+g.items.length, 0);
  const doneCount = (() => { let n=0; for (let i=0;i<total;i++) if (state.safetyCheckChecks[i]) n++; return n; })();
  const allChecked = doneCount === total;

  let idx = 0;
  const groupsHtml = groups.map(g => {
    const header = g.label ? `<div style="display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;font-weight:700;color:${g.danger?'var(--danger-fg)':'var(--text-faint)'};">${g.danger?'⚠ ':''}${escHtml(g.label)}</div>` : '';
    const items = g.items.map(c => {
      const i = idx++;
      const on = !!state.safetyCheckChecks[i];
      return `<div style="background:${on?'var(--success-bg)':'var(--surface-raised)'};border:1px solid ${on?'var(--success-solid)':'var(--bd-default)'};border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;" onclick="safetyCheckToggle(${i})">
        <div style="width:22px;height:22px;border:1.5px solid ${on?'var(--success-solid)':'var(--bd-strong)'};background:${on?'var(--success-solid)':'white'};color:white;border-radius:5px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;">${on?'✓':''}</div>
        <div style="flex:1;">
          <div style="font-family:var(--font-zh);font-size:12px;font-weight:600;color:${on?'var(--success-fg)':'var(--text-primary)'};line-height:1.5;">${escHtml(c.t)}</div>
          <div style="font-family:var(--font-zh);font-size:10px;color:${on?'var(--success-fg)':'var(--text-muted)'};margin-top:3px;line-height:1.6;opacity:0.85;">${escHtml(c.d)}</div>
        </div>
      </div>`;
    }).join('');
    return header + '<div style="display:flex;flex-direction:column;gap:8px;">' + items + '</div>';
  }).join('');

  return `
<div class="mp-modal-bg" onclick="if(event.target===this) safetyCheckClose();">

// Mini-program coach package — delegates to coachPackOpen
function mpCoachPackOpen(slug, tag) {
  if (tag === 'SINGLE') {
    state.miniContext = Object.assign({}, state.miniContext, { slug });
    waveOpen();
    return;
  }
  if (typeof coachPackOpen === 'function') coachPackOpen(slug, tag);
}

// Coach package subscription (skiguidelech-inspired)
function coachPackOpen(slug, tag) {
  const c = COACHES.find(x => x.slug === slug);
  if (!c) return;
  const base = parseInt((c.rate||'€80').match(/\d+/) || [80], 10);
  const packMap = {
    'SINGLE': { name: '单次 Wave', amount: base, body: '1 小时课时' },
    '5×': { name: '5 课包', amount: Math.round(base * 5 * 0.9), body: '5 小时 · 本季可用' },
    'WEEKEND': { name: '周末小团', amount: Math.round(base * 0.6 * 4), body: '4 小时 · 4-8 人成团 · 人均省 40%' },
    'SEASON': { name: '整季私教', amount: Math.round(base * 15 * 0.75), body: '15 次 · 全季优先排期 · 个性化训练计划' }
  };
  const p = packMap[tag] || packMap.SINGLE;
  if (typeof wxPayOpen === 'function') {
    wxPayOpen({
      amount: p.amount,
      title: c.name + ' · ' + p.name,
      body: p.body,
      onSuccess: function() {
        state.outbox.unshift({
          kind: 'coach-pack', toName: c.name, toInitial: c.initial, sentAt: '刚刚',
          form: { coach: c.slug, pack: tag, amount: p.amount },
          status: '已订阅 · €' + p.amount + ' 已扣款 · 教练已收到通知'
        });
        state.notifications.unshift({
          id: 'n-' + Date.now(), kind: 'wave',
          title: '已订阅 ' + c.name + ' · ' + p.name,
          body: '€' + p.amount + ' 已支付 · ' + c.name + ' 会主动约你第一节课',
          at: '刚刚', unread: true
        });
        wxPayClose();
        goWeb('messages');
      }
    });
  }
}

function renderWebRoutes() {
  const types = [
    { id: 'all', label: '全部', count: ROUTES.length },
    { id: 'ski-tour', label: 'Ski Touring', count: ROUTES.filter(r=>r.type==='ski-tour').length },
    { id: 'ski-resort', label: '雪场内', count: ROUTES.filter(r=>r.type==='ski-resort').length },
    { id: 'bike', label: '骑行', count: ROUTES.filter(r=>r.type==='bike').length },
    { id: 'hike', label: '徒步', count: ROUTES.filter(r=>r.type==='hike').length }
  ];
  const active = state.routesTypeFilter || 'all';
  const list = active === 'all' ? ROUTES : ROUTES.filter(r => r.type === active);
  const diffColor = (d) => ({ blue: '#3D6390', red: '#C95C2C', black: '#1F2A38' }[d] || '#76705F');
  return `
<div class="web-breadcrumb"><a onclick="goWeb('home')">Funwild</a> / 路线</div>

<div style="background:linear-gradient(135deg, #244E37 0%, #0F2419 70%);color:white;padding:48px 64px 36px;">
  <div style="max-width:780px;">
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.65);font-weight:700;margin-bottom:12px;">ROUTES · 路线深度攻略</div>
    <h1 style="font-family:var(--font-display);font-size:38px;font-weight:600;letter-spacing:-0.8px;line-height:1.2;margin:0 0 12px;">不只是地点 · 完整中文路线</h1>
    <p style="font-family:var(--font-zh);font-size:14px;line-height:1.8;opacity:0.88;max-width:620px;">海拔图 · 路点 · 装备清单 · 季节性提示 · 危险点 · 推荐教练 + GPX 下载。<br>每条路线都做到能从攻略直接出发的水平。</p>
  </div>
</div>

<div style="max-width:1100px;margin:32px auto 0;padding:0 24px 60px;">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">
    ${types.map(t => `<button class="mp-form-chip ${active===t.id?'active':''}" onclick="state.routesTypeFilter='${t.id}';render()" style="padding:8px 14px;">${escHtml(t.label)} <em style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint);font-style:normal;margin-left:3px;">${t.count}</em></button>`).join('')}
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;">
    ${list.map(r => `
      <div onclick="goWeb('route',{slug:'${r.slug}'})" style="background:var(--surface-raised);border:1px solid var(--bd-default);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 180ms, box-shadow 180ms;" onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 12px 28px rgba(0,0,0,0.08)';" onmouseout="this.style.transform='';this.style.boxShadow='';">
        <!-- Mini elevation preview -->
        <div style="height:120px;background:linear-gradient(180deg, var(--surface-sunken), white);position:relative;overflow:hidden;">
          <svg viewBox="0 0 320 120" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
            ${(function(){
              const pts = r.waypoints;
              if (!pts || pts.length < 2) return '';
              const maxKm = pts[pts.length-1].km;
              const minE = Math.min(...pts.map(p=>p.elev));
              const maxE = Math.max(...pts.map(p=>p.elev));
              const range = maxE - minE || 1;
              const xs = pts.map(p => (p.km / maxKm) * 320);
              const ys = pts.map(p => 110 - ((p.elev - minE) / range) * 85);
              const pathD = pts.map((p,i) => (i===0?'M':'L') + xs[i] + ',' + ys[i]).join(' ');
              const fillD = pathD + ' L 320,120 L 0,120 Z';
              return `<path d="${fillD}" fill="${diffColor(r.difficulty)}" opacity="0.18"/>
                      <path d="${pathD}" fill="none" stroke="${diffColor(r.difficulty)}" stroke-width="2" stroke-linejoin="round"/>`;
            })()}
          </svg>
          <span style="position:absolute;top:10px;left:12px;background:${diffColor(r.difficulty)};color:white;padding:3px 8px;border-radius:3px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.5px;">${escHtml(r.difficultyLabel)}</span>
          <span style="position:absolute;top:10px;right:12px;background:white;color:var(--text-secondary);padding:3px 8px;border-radius:3px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.5px;border:1px solid var(--bd-default);">${escHtml(r.sport)}</span>
          <span style="position:absolute;bottom:10px;right:12px;background:rgba(255,255,255,0.92);color:var(--text-primary);padding:3px 8px;border-radius:3px;font-family:var(--font-mono);font-size:10px;font-weight:600;">📈 ${r.elevationStart}m → ${r.elevationPeak}m</span>
        </div>
        <div style="padding:14px 16px;">
          <div style="font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-0.3px;margin-bottom:4px;">${escHtml(r.name)}</div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-bottom:10px;letter-spacing:0.3px;">${escHtml(r.region)}</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--bd-subtle);border-bottom:1px solid var(--bd-subtle);">
            <div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);">距离</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;">${r.distance} km</div></div>
            <div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);">爬升</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;">${r.elevationGain} m</div></div>
            <div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);">时长</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;">${r.duration}h</div></div>
            <div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);">季节</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:600;line-height:1.2;padding-top:2px;">${escHtml(r.season.slice(0,8))}</div></div>
          </div>
          <div style="font-family:var(--font-zh);font-size:11px;color:var(--text-secondary);line-height:1.7;margin-top:10px;">${escHtml(r.summary.length > 90 ? r.summary.slice(0,90)+'...' : r.summary)}</div>
        </div>
      </div>
    `).join('')}
  </div>

  ${list.length === 0 ? `<div style="padding:60px 20px;text-align:center;background:var(--surface-raised);border:1px dashed var(--bd-default);border-radius:10px;"><div style="font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:6px;">没有路线</div></div>` : ''}
</div>`;
}

function renderWebRouteDetail() {
  const slug = (state.webContext && state.webContext.slug) || 'hintertux-tour-entry';
  const r = ROUTES.find(x => x.slug === slug) || ROUTES[0];
  const diffColor = ({ blue: '#3D6390', red: '#C95C2C', black: '#1F2A38' }[r.difficulty] || '#76705F');
  // Compute elevation profile coords
  const pts = r.waypoints;
  const maxKm = pts[pts.length-1].km;
  const minE = Math.min(...pts.map(p=>p.elev));
  const maxE = Math.max(...pts.map(p=>p.elev));
  const range = maxE - minE || 1;
  const W = 900, H = 240;
  const xs = pts.map(p => 40 + (p.km / maxKm) * (W - 80));
  const ys = pts.map(p => H - 30 - ((p.elev - minE) / range) * (H - 70));
  const pathD = pts.map((p,i) => (i===0?'M':'L') + xs[i] + ',' + ys[i]).join(' ');
  const fillD = pathD + ' L ' + xs[xs.length-1] + ',' + (H - 30) + ' L ' + xs[0] + ',' + (H - 30) + ' Z';
  return `
<div class="web-breadcrumb"><a onclick="goWeb('routes')">路线</a> / ${escHtml(r.name)}</div>

<!-- Hero -->
<div style="background:linear-gradient(135deg, ${diffColor} 0%, ${diffColor}CC 100%);color:white;padding:42px 64px 38px;position:relative;overflow:hidden;">
  <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.18;">
    <path d="M0,300 L0,160 L200,90 L400,140 L600,60 L800,130 L1000,80 L1200,140 L1200,300 Z" fill="rgba(255,255,255,0.4)"/>
  </svg>
  <div style="position:relative;max-width:880px;">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">

      <span style="padding:3px 8px;background:rgba(255,255,255,0.18);border-radius:3px;font-family:var(--font-mono);font-size:10px;font-weight:700;">${escHtml(r.difficultyLabel)}</span>
      <span style="padding:3px 8px;background:rgba(255,255,255,0.18);border-radius:3px;font-family:var(--font-mono);font-size:10px;">${escHtml(r.season)}</span>
    </div>
    <h1 style="font-family:var(--font-display);font-size:36px;font-weight:600;letter-spacing:-0.8px;line-height:1.15;margin:0 0 8px;">${escHtml(r.name)}</h1>
    <div style="font-family:var(--font-mono);font-size:13px;letter-spacing:0.5px;opacity:0.88;">${escHtml(r.region)}</div>
    <p style="font-family:var(--font-zh);font-size:14px;line-height:1.8;opacity:0.95;max-width:780px;margin:14px 0 0;">${escHtml(r.summary)}</p>
  </div>
</div>

<!-- Stats strip -->
<div style="background:var(--n-900);color:white;padding:18px 64px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
  ${[
    ['距离', r.distance + ' km', '单程'],
    ['累积爬升', r.elevationGain + ' m', '从 '+r.elevationStart+'m 到 '+r.elevationPeak+'m'],
    ['时长', r.duration + ' h', r.type==='hike' ? (Math.ceil(r.duration/8))+'-' + Math.ceil(r.duration/6) + ' 天' : '单日完成'],
    ['难度', r.difficultyLabel, r.season]
  ].map(([l,v,sub]) => `
    <div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;opacity:0.65;">${escHtml(l)}</div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-0.5px;">${escHtml(v)}</div>
      <div style="font-family:var(--font-mono);font-size:10px;opacity:0.55;margin-top:2px;">${escHtml(sub)}</div>
    </div>
  `).join('')}
</div>

<div style="max-width:1100px;margin:36px auto 0;padding:0 24px 60px;">

  <!-- Elevation profile -->
  <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--acc-600);text-transform:uppercase;font-weight:700;margin-bottom:8px;">ELEVATION · 海拔剖面</div>
  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.5px;margin:0 0 16px;">${maxE - minE} m 累积差 · ${pts.length} 个路点</h2>
  <div style="background:var(--surface-raised);border:1px solid var(--bd-default);border-radius:10px;padding:18px 22px;margin-bottom:32px;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <!-- Grid -->
      <defs>
        <linearGradient id="elev-grad" x1="0" y1="0" x2="0" y2="1">

      ${[0,1,2,3,4].map(i => `<line x1="40" y1="${30 + i*((H-60)/4)}" x2="${W-40}" y2="${30 + i*((H-60)/4)}" stroke="var(--bd-subtle)" stroke-width="0.5"/>`).join('')}
      <!-- Elevation area + line -->
      <path d="${fillD}" fill="url(#elev-grad)"/>

          <circle cx="${xs[i]}" cy="${ys[i]}" r="5" fill="white" stroke="${diffColor}" stroke-width="2"/>

      `).join('')}
      <!-- Y axis labels -->
      <text x="36" y="38" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="var(--text-muted)">${maxE}m</text>
      <text x="36" y="${H-28}" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="var(--text-muted)">${minE}m</text>
    </svg>
  </div>

  <!-- Waypoints -->
  <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--acc-600);text-transform:uppercase;font-weight:700;margin-bottom:8px;">WAYPOINTS · 路点</div>
  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.5px;margin:0 0 16px;">${pts.length} 个关键点 · 一步一步走</h2>

            <div style="font-family:var(--font-mono);font-size:11px;color:${diffColor};font-weight:700;">${p.elev}m</div>
          </div>
          <div style="font-family:var(--font-zh);font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.6;">${escHtml(p.note)}</div>
        </div>
      </div>
    `).join('')}

  <!-- Hazards -->
  <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--danger-fg);text-transform:uppercase;font-weight:700;margin-bottom:8px;">HAZARDS · 危险点</div>
  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.5px;margin:0 0 16px;">出发前先记住这 ${r.hazards.length} 条</h2>
  <div style="background:var(--danger-bg);border:1px solid var(--danger-solid);border-left:3px solid var(--danger-solid);border-radius:8px;padding:18px 22px;margin-bottom:32px;">

    </ul>

  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.5px;margin:0 0 16px;">${r.gear.length} 项 · 没有不出发</h2>

function webOnboardingOpen() {
  // Web + mp share the same taxonomy state so preferences sync across platforms
  state.webOnboarding = {
    step: 1,
    levels: {},   // per selected sub-sport: { 'catId:subId': '中级' }
    interests: []
  };

  state.webOnboardingAnimated = false;
  render();
}
function webOnboardingClose(skipped) {
  if (skipped) state.webOnboardingSkipped = true;
  state.webOnboardingSeen = true;
  state.showWebOnboarding = false;
  render();
}
function webOnboardingSet(field, value) {
  state.webOnboarding[field] = value;
  render();
}
function webOnboardingSetLevel(key, value) {
  if (!state.webOnboarding.levels) state.webOnboarding.levels = {};
  state.webOnboarding.levels[key] = value;
  render();
}
function webOnboardingToggleInterest(v) {
  const arr = state.webOnboarding.interests;
  const i = arr.indexOf(v);
  if (i >= 0) arr.splice(i, 1); else arr.push(v);
  render();
}
function webOnboardingNext() {
  const o = state.webOnboarding;
  // Validate current step (sports → location → level → interests → finish)
  if (o.step === 2 && onbSportTotal() === 0) return;
  if (o.step === 3 && !state.onboardingCountry) return;
  if (o.step === 4 && !onbSelectedSports().every(s => (o.levels||{})[s.key])) return;
  if (o.step === 5 && o.interests.length === 0) return;
  o.step = Math.min(6, o.step + 1);
  render();
}
function webOnboardingBack() {
  if (state.webOnboarding.step > 1) state.webOnboarding.step--;
  render();
}
function webOnboardingFinish() {
  const o = state.webOnboarding;
  // Apply through shared mini-program writer (handles USER + taxonomy)
  if (typeof onbApplyToUser === 'function') onbApplyToUser();
  // Per-sport levels → keep a single representative on USER (used app-wide), plus a per-sport summary
  const selSports = onbSelectedSports();
  const levelSummary = selSports.filter(s => (o.levels||{})[s.key]).map(s => ({ sport: s.sub.name, level: o.levels[s.key] }));
  const repLevel = levelSummary.length ? levelSummary[0].level : '';
  if (repLevel) USER.level = repLevel;
  USER.interests = o.interests.slice();
  if (state.webUser && USER.city) state.webUser.city = USER.city;
  // Compose summary result for personalization chip on web home
  const country = LOCATIONS_TAXONOMY.find(c => c.code === state.onboardingCountry);
  const sportSummary = (function(){
    const out = [];
    for (const cat of SPORTS_TAXONOMY) {
      const s = state.onboardingSports[cat.id];
      if (!s || (!s.picked && !s.subs.length)) continue;
      if (s.picked) out.push(cat.name); else s.subs.forEach(id => {
        const sub = cat.subs.find(x => x.id === id); if (sub) out.push(sub.name);
      });
    }
    return out;
  })();
  state.webOnboardingResult = {
    sportSummary: sportSummary,
    country: country ? country.name : '',
    countryCode: state.onboardingCountry,
    cities: state.onboardingCities.slice(),
    level: repLevel,
    levelSummary: levelSummary,
    interests: o.interests.slice()
  };
  state.webOnboardingSeen = true;
  state.showWebOnboarding = false;
  state.notifications.unshift({
    id: 'n-onb-' + Date.now(), kind: 'system',
    title: '欢迎来到 Funwild',
    body: '已根据你的偏好（' + (country?country.name:'') + ' · ' + (sportSummary.slice(0,2).join('/') || '运动未选') + ' · ' + (repLevel||'水平未选') + '）个性化推荐内容',
    at: '刚刚', unread: true
  });
  render();
}

    langs: [], langOther: '',                // 教学语言（选填）+ 其他
    currency: '€', rateMin: '', rateMax: '', // 收费：币种 + 数字
    certs: [], uploaded: '',

function partnerApplySetCountry(code) { state.partnerApply.country = code; state.partnerApply.cities = []; render(); }
// Compose a coach's display fields from the structured location / language / rate inputs
function _partnerCity(p) {
  var co = LOCATIONS_TAXONOMY.find(function(c) { return c.code === p.country; });
  var coName = co ? co.name : '';
  if (p.cities.length) return (coName ? coName + ' · ' : '') + p.cities.join('、');
  return coName || '—';
}
function _partnerLangs(p) {
  var out = p.langs.filter(function(l) { return l !== '其他'; });
  if (p.langs.indexOf('其他') >= 0 && p.langOther) out = out.concat(p.langOther.split(/[,，、\/]/).map(function(s){return s.trim();}).filter(Boolean));
  return out;
}
function _partnerRate(p) {
  if (!p.rateMin && !p.rateMax) return '面议';
  var num = p.rateMin && p.rateMax ? (p.rateMin + '-' + p.rateMax) : (p.rateMin ? p.rateMin + '+' : '~' + p.rateMax);
  return p.currency + num + '/h';
}
function partnerApplyToggle(f, v) {

  if (i >= 0) a.splice(i, 1); else a.push(v);

}

  render();
}
function partnerApplyNext() {
  var p = state.partnerApply;
  if (p.step === 1 && !p.type) return;
  if (p.step === 2) {
    if (p.type === 'outfitter') { if (!p.orgName || !p.wechat) return; }
    else if (!p.name || !p.wechat) return;
  }
  if (p.step === 3 && !p.uploaded) return;
  p.step = Math.min(4, p.step + 1);
  render();
}
function partnerApplyBack() {
  var p = state.partnerApply;
  var min = p.type && p._fromType !== false ? 2 : 1;  // can't go back past 2 if type was preset
  p.step = Math.max(p.step <= 2 && p.type ? 2 : 1, p.step - 1);
  render();
}
function partnerApplySubmit() {
  state.partnerApply.status = 'reviewing';
  render();
}
function _partnerSlug(name, type) {
  var a = (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return (a || type) + '-' + (COACHES.length + OUTFITTERS.length);
}
function partnerApplyApprove() {
  var p = state.partnerApply;
  var firstChar = (p.name || p.orgName || '新').charAt(0);
  if (p.type === 'outfitter') {
    var oslug = _partnerSlug(p.orgName || p.name, 'outfitter');
    OUTFITTERS.push({
      slug: oslug, name: p.orgName || p.name || '新地接团', org: p.orgName || '商业地接',
      days: p.days || '5 天 4 夜', dest: p.destCountries.length ? p.destCountries.join('、') : (p.dest || '欧洲'),
      price: parseInt(p.price, 10) || 1200, currency: p.currency,
      audience: '华人游客', rating: 5.0, completed: 0,
      summary: p.bio || '新入驻地接团 · 等待首批成团评价。',
      includes: p.includes.length ? p.includes : ['住宿', '缆车', '教练']
    });
    p.generated = { kind: 'outfitter', slug: oslug };
  } else {
    var cslug = _partnerSlug(p.name, p.type);
    var genLangs = _partnerLangs(p);
    COACHES.push({
      slug: cslug, name: p.name, avatar: firstChar, initial: firstChar,

    <div class="qr-modal-code" onclick="webLogin()" title="点击模拟扫码登录" style="margin-top:20px;">
      <div class="qr-modal-code-inner">
        <svg viewBox="0 0 21 21" shape-rendering="crispEdges" style="width:100%;height:100%;background:white;">
          ${(function(){
            let seed = 999;
            const cells = [];
            for (let y=0;y<21;y++) for (let x=0;x<21;x++) {
              const inF = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
              const ring = (x===0||x===6||y===0||y===6)&&(x<7&&y<7);
              const ringTR = (x===14||x===20||y===0||y===6)&&(x>13&&y<7);
              const ringBL = (x===0||x===6||y===14||y===20)&&(x<7&&y>13);
              const ctr = (x>=2&&x<=4&&y>=2&&y<=4)||(x>=16&&x<=18&&y>=2&&y<=4)||(x>=2&&x<=4&&y>=16&&y<=18);
              let on;
              if (inF) on = ring||ringTR||ringBL||ctr;
              else { seed = (seed*1103515245+12345)|0; on = ((seed>>>16)&0xff) > 130; }
              if (on) cells.push('<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#0F2419"/>');
            }
            return cells.join('');
          })()}
        </svg>
      </div>
      <div class="qr-modal-code-logo">趣野</div>
    </div>
    <div class="qr-modal-hint">在微信内扫一扫 · 30 秒完成</div>

</div>`;

// ===== QR Code Modal (Website → Mini Program handoff) =====
// Click 二维码 → simulateQrScan() → openInMini() → mini-program section
function renderQrModal() {
  if (!state.showQrModal) return '';
  const q = state.showQrModal;
  // Generate a faux QR pattern: deterministic 21x21 grid based on target string
  let seed = 0;
  for (let i = 0; i < (q.target + (q.ctx.slug || '')).length; i++) {
    seed = (seed * 31 + (q.target + (q.ctx.slug || '')).charCodeAt(i)) | 0;
  }
  const cells = [];
  for (let y = 0; y < 21; y++) {
    for (let x = 0; x < 21; x++) {
      // Fixed alignment markers (top-left, top-right, bottom-left finder patterns)
      const inFinder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
      const finderRing = (x === 0 || x === 6 || y === 0 || y === 6) && (x < 7 && y < 7);
      const finderRingTR = (x === 14 || x === 20 || y === 0 || y === 6) && (x > 13 && y < 7);
      const finderRingBL = (x === 0 || x === 6 || y === 14 || y === 20) && (x < 7 && y > 13);
      const finderCenter = (x >= 2 && x <= 4 && y >= 2 && y <= 4) || (x >= 16 && x <= 18 && y >= 2 && y <= 4) || (x >= 2 && x <= 4 && y >= 16 && y <= 18);
      let on;
      if (inFinder) {
        on = finderRing || finderRingTR || finderRingBL || finderCenter;
      } else {
        seed = (seed * 1103515245 + 12345) | 0;
        on = ((seed >>> 16) & 0xff) > 130;
      }
      cells.push(on ? '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#0F2419"/>' : '');
    }
  }
  const qrSvg = '<svg viewBox="0 0 21 21" shape-rendering="crispEdges" style="width:100%;height:100%;background:white;">' + cells.join('') + '</svg>';

  // Platform-specific rendering: PC browser (default) / mobile non-wx / inside WeChat
  const platform = state.demoPlatform || 'pc-browser';
  const draftId = q.ctx && q.ctx.draft;
  const targetPath = 'pages/' + q.target + '/index';
  const draftRecord = draftId ? state.drafts[draftId] : null;

  let primaryBlock = '';
  if (platform === 'wechat') {
    // Inside WeChat browser → render wx-open-launch-weapp mock button
    primaryBlock = `
      <button class="qr-wx-launch" onclick="simulateQrScan()">
        <span class="qr-wx-launch-icon">wx</span>
        <span class="qr-wx-launch-body">
          <span class="qr-wx-launch-body-main">在小程序中打开</span>
          <span class="qr-wx-launch-body-sub">&lt;wx-open-launch-weapp&gt; · 直接唤起</span>
        </span>
      </button>

// Allow hash-based routing — supports:
//   #cover  /  #brand  /  #journey
//   #mini:home  /  #web:resort
//   #mini:coach-detail/zhanglei  (slug becomes miniContext.slug)
//   #mini:resort-detail/stubaier?from=web   (from=web triggers entry banner)
function applyHash() {
  const raw = (location.hash || '#cover').slice(1);
  const [path, query] = raw.split('?');
  const [sec, sub] = path.split(':');
  if (!['cover','mini','web','brand','journey'].includes(sec)) return;
  const params = {};
  if (query) query.split('&').forEach(kv => { const [k,v] = kv.split('='); if (k) params[k] = decodeURIComponent(v||''); });
  if (sub) {
    const [page, slug] = sub.split('/');
    if (sec === 'mini') {
      state.miniPage = page;
      if (slug) state.miniContext = { slug };
      if (params.from) {
        state.miniEntrySource = params.from;
        state.miniEntryFromPage = params.fromPage || null;
        state.miniEntryAt = page;
      }
    }
    if (sec === 'web') {
      state.webPage = page;
      if (slug) state.webContext = { slug };
    }
  }
  state.section = sec;
  goSection(sec);
}
applyHash();
window.addEventListener('hashchange', applyHash);
